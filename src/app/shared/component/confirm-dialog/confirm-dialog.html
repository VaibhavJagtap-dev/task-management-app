<h2 mat-dialog-title>Delete task?</h2>

<mat-dialog-content>
  <p class="message">
    <strong>{{ data.title }}</strong>
  </p>
  <span>This action cannot be undone.</span>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="outlined" [mat-dialog-close]="false" cdkFocusInitial>Cancel</button>
  <button matButton="filled" class="delete-btn" [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
